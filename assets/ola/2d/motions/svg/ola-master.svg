<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 2048" role="img" aria-labelledby="ola-title ola-description" focusable="false">
  <title id="ola-title">OLA AI companion</title>
  <desc id="ola-description">A friendly rounded white AI companion robot with a glass face and cyan expression.</desc>
  <defs>
    <linearGradient id="ola-shell" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#EDF1F5" />
    </linearGradient>
    <linearGradient id="ola-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17213B" />
      <stop offset="1" stop-color="#0B1020" />
    </linearGradient>
  </defs>
  <g id="ola-root">
    <g id="shadow">
      <ellipse cx="1024" cy="1810" rx="510" ry="88" fill="#19263D" opacity="0.16" />
    </g>
    <g id="leg-left">
      <rect x="760" y="1400" width="230" height="285" rx="110" fill="url(#ola-shell)" stroke="#C9D2DC" stroke-width="18" />
    </g>
    <g id="foot-left">
      <ellipse cx="845" cy="1695" rx="210" ry="112" fill="url(#ola-shell)" stroke="#C9D2DC" stroke-width="18" />
    </g>
    <g id="leg-right">
      <rect x="1058" y="1400" width="230" height="285" rx="110" fill="url(#ola-shell)" stroke="#C9D2DC" stroke-width="18" />
    </g>
    <g id="foot-right">
      <ellipse cx="1203" cy="1695" rx="210" ry="112" fill="url(#ola-shell)" stroke="#C9D2DC" stroke-width="18" />
    </g>
    <g id="body">
      <rect x="650" y="990" width="748" height="550" rx="280" fill="url(#ola-shell)" stroke="#C9D2DC" stroke-width="20" />
      <ellipse cx="1024" cy="1070" rx="250" ry="52" fill="#FFFFFF" opacity=".62" />
    </g>
    <g id="chest-led">
      <path d="M 1024 1269.6 C 926.5 1215, 969.4 1137, 1024 1187.7 C 1078.6 1137, 1121.5 1215, 1024 1269.6 Z" fill="#45EAF2" stroke="#A8F7FA" stroke-width="12" />
    </g>
    <g id="arm-left">
      <rect x="520" y="1050" width="260" height="410" rx="125" fill="url(#ola-shell)" stroke="#C9D2DC" stroke-width="18" />
    </g>
    <g id="hand-left">
      <ellipse cx="565" cy="1430" rx="105" ry="92" fill="#FFFFFF" stroke="#C9D2DC" stroke-width="16" />
    </g>
    <g id="arm-right">
      <rect x="1268" y="1050" width="260" height="410" rx="125" fill="url(#ola-shell)" stroke="#C9D2DC" stroke-width="18" />
    </g>
    <g id="hand-right">
      <ellipse cx="1483" cy="1430" rx="105" ry="92" fill="#FFFFFF" stroke="#C9D2DC" stroke-width="16" />
    </g>
    <g id="ear-left">
      <ellipse cx="424" cy="654" rx="100" ry="145" fill="#EDF1F5" stroke="#C9D2DC" stroke-width="20" />
      <ellipse cx="424" cy="654" rx="48" ry="76" fill="#A8F7FA" opacity=".55" />
    </g>
    <g id="ear-right">
      <ellipse cx="1624" cy="654" rx="100" ry="145" fill="#EDF1F5" stroke="#C9D2DC" stroke-width="20" />
      <ellipse cx="1624" cy="654" rx="48" ry="76" fill="#A8F7FA" opacity=".55" />
    </g>
    <g id="head">
      <ellipse cx="1024" cy="650" rx="600" ry="448" fill="url(#ola-shell)" stroke="#C9D2DC" stroke-width="22" />
      <ellipse cx="870" cy="350" rx="310" ry="76" fill="#FFFFFF" opacity=".72" transform="rotate(-8 870 350)" />
      <g id="face-screen">
        <rect x="560" y="390" width="928" height="540" rx="245" fill="url(#ola-glass)" />
        <path d="M690 480 C900 400 1160 405 1370 490" fill="none" stroke="#FFFFFF" stroke-width="22" opacity=".09" stroke-linecap="round" />
      </g>
      <g id="cheek-left">
        <ellipse cx="686" cy="782" rx="74" ry="31" fill="#FF9FB2" opacity=".62" />
      </g>
      <g id="eye-left">
        <ellipse class-="ola-eye-shape" cx="805" cy="635" rx="52" ry="82" fill="#45EAF2" />
        <ellipse class-="ola-eye-glint" cx="790" cy="610" rx="13" ry="21" fill="#FFFFFF" opacity=".82" />
      </g>
      <g id="lash-left">
        <path d="M736 597 l-34 -24 M732 630 l-38 -7" fill="none" stroke="#A8F7FA" stroke-width="13" stroke-linecap="round" />
      </g>
      <g id="cheek-right">
        <ellipse cx="1362" cy="782" rx="74" ry="31" fill="#FF9FB2" opacity=".62" />
      </g>
      <g id="eye-right">
        <ellipse class-="ola-eye-shape" cx="1243" cy="635" rx="52" ry="82" fill="#45EAF2" />
        <ellipse class-="ola-eye-glint" cx="1228" cy="610" rx="13" ry="21" fill="#FFFFFF" opacity=".82" />
      </g>
      <g id="lash-right">
        <path d="M1312 597 l34 -24 M1316 630 l38 -7" fill="none" stroke="#A8F7FA" stroke-width="13" stroke-linecap="round" />
      </g>
      <g id="mouth">
        <path class-="ola-mouth-shape" d="M952 780 Q1024 844 1096 780" fill="none" stroke="#45EAF2" stroke-width="20" stroke-linecap="round" />
      </g>
      <g id="sleep-zzz" opacity="0" aria-hidden="true">
        <path class-="ola-z ola-z-1" d="M1375 500 h54 l-54 62 h54" fill="none" stroke="#45EAF2" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
        <path class-="ola-z ola-z-2" d="M1480 405 h67.5 l-67.5 77.5 h67.5" fill="none" stroke="#45EAF2" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
        <path class-="ola-z ola-z-3" d="M1585 290 h83.7 l-83.7 96.10000000000001 h83.7" fill="none" stroke="#45EAF2" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
      </g>
      <g id="alert-mark" opacity="0" aria-hidden="true">
        <path d="M1510 330 L1560 180 L1610 330" fill="none" stroke="#FF7657" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="1560" cy="380" r="15" fill="#FF7657" />
      </g>
    </g>
  </g>
</svg>